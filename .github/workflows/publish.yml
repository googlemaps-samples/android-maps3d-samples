name: Publish

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build APKs
        run: |
          ./gradlew :Maps3DSamples:ApiDemos:kotlin-app:assembleDebug :Maps3DSamples:advanced:app:assembleDebug
          cp Maps3DSamples/ApiDemos/kotlin-app/build/outputs/apk/debug/kotlin-app-debug.apk ApiDemos-kotlin-debug.apk
          cp Maps3DSamples/advanced/app/build/outputs/apk/debug/app-debug.apk advanced-kotlin-debug.apk

      - name: Upload APKs to release
        run: gh release upload "${{ github.event.release.tag_name }}" ApiDemos-kotlin-debug.apk advanced-kotlin-debug.apk --clobber
        env:
          GH_TOKEN: ${{ github.token }}
